# Hợp đồng dữ liệu: bảng bệnh nhân THÔ của từng bệnh viện (eICU patient.csv)
# Áp dụng chung cho raw_patient_hospital_A, _B, _C.
#
# Ý nghĩa các trường của một cột:
#   type           : int | float | string | category
#   required       : true  -> cột bắt buộc phải có (thiếu / đổi tên / xóa = BREAKING)
#   nullable       : false -> không được có ô trống nào
#   max_null_pct   : % ô trống tối đa cho phép (vượt = BREAKING)
#   min / max      : khoảng giá trị hợp lý (chỉ BREAKING khi > 1% số dòng nằm ngoài)
#   allowed_values : tập giá trị cho phép (chỉ BREAKING khi > 1% số dòng sai)
#   pattern        : biểu thức chính quy giá trị phải khớp (chỉ BREAKING khi > 1% số dòng sai)
#   sensitive      : cột nhạy cảm (định danh bệnh nhân) -> phải giả danh hóa trước tầng AI-ready
#   description    : mô tả cột, hiển thị trong catalog

name: raw_patient
description: Bảng bệnh nhân thô, giữ nguyên định dạng gốc của eICU
applies_to:
  - raw_patient_hospital_*
owner: Đội IT bệnh viện nguồn
version: "1.0"
tier: raw

columns:
  patientunitstayid:
    type: int
    required: true
    nullable: false
    max_null_pct: 0
    sensitive: true
    description: Mã lượt nằm ICU của bệnh nhân (định danh)

  uniquepid:
    type: string
    required: false
    nullable: true
    sensitive: true
    description: Mã bệnh nhân duy nhất trên toàn hệ thống eICU (định danh)

  hospitalid:
    type: int
    required: true
    nullable: false
    max_null_pct: 0
    sensitive: false
    description: Mã bệnh viện trong eICU

  # age trong eICU là CHUỖI: có thể là "45", "> 89" hoặc rỗng -> không đặt min/max ở tầng raw
  age:
    type: string
    required: true
    nullable: true
    max_null_pct: 30
    sensitive: false
    description: Tuổi (chuỗi, người trên 89 tuổi ghi là "> 89")

  # gender gốc: Male / Female (thỉnh thoảng Other / Unknown / rỗng)
  gender:
    type: category
    required: true
    nullable: true
    max_null_pct: 30
    allowed_values: [Male, Female, Other, Unknown]
    sensitive: false
    description: Giới tính

  # Cân nặng lúc nhập ICU (kg). Dữ liệu thật thiếu 12-22,5% cả viện, nhưng kiểm tra theo
  # TỪNG ĐỢT thì có đợt thiếu 30,8% (viện A đợt 3: 13 bệnh nhân) -> ngưỡng 40%.
  # Lỗi xóa trắng 50% cân nặng vẫn bị chặn.
  admissionweight:
    type: float
    required: true
    nullable: true
    max_null_pct: 40
    min: 20
    max: 400
    sensitive: false
    description: Cân nặng lúc nhập ICU (kg)

  # Nhãn tử vong ICU dùng cho bài toán AI
  unitdischargestatus:
    type: category
    required: true
    nullable: true
    max_null_pct: 30
    allowed_values: [Alive, Expired]
    sensitive: false
    description: Tình trạng lúc ra khỏi ICU (Alive / Expired)
