# Hợp đồng dữ liệu: bảng xét nghiệm CHUẨN HÓA
# Ý nghĩa các trường: xem contracts/raw_patient.yaml
# v1.1: thêm source_batch
# v1.2: thêm lab_offset (thời điểm có kết quả) để tầng AI-ready chọn cửa sổ 24 giờ đầu

name: standardized_labs
description: Kết quả xét nghiệm của cả 3 bệnh viện sau khi chuẩn hóa
applies_to:
  - standardized_labs
owner: Nhóm Kỹ thuật dữ liệu (Người 1)
version: "1.2"
tier: standardized

columns:
  patient_id:
    type: int
    required: true
    nullable: false
    max_null_pct: 0
    sensitive: true
    description: Mã bệnh nhân (định danh)

  lab_name:
    type: string
    required: true
    nullable: true
    max_null_pct: 30
    sensitive: false
    description: Tên xét nghiệm

  lab_value:
    type: float
    required: true
    nullable: true
    max_null_pct: 30
    sensitive: false
    description: Kết quả xét nghiệm

  lab_offset:
    type: int
    required: false
    nullable: true
    sensitive: false
    description: Thời điểm có kết quả, số phút tính từ lúc nhập ICU (có thể âm)

  source_hospital:
    type: string
    required: true
    nullable: false
    max_null_pct: 0
    sensitive: false
    description: Bệnh viện gửi dữ liệu

  source_batch:
    type: string
    required: true
    nullable: false
    max_null_pct: 0
    sensitive: false
    description: Đợt gửi chứa dòng này (hospital_X/<thời điểm gửi>)
