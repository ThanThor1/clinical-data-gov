# Cấu hình chính sách phân quyền truy cập theo vai trò (RBAC)
# Quản lý bởi: Người 3 (Catalog, Phân quyền, Audit & Báo cáo)
#
# Ý nghĩa các trường của một vai trò:
#   allowed_tiers      : các tầng được truy cập (raw, standardized, ai_ready) + catalog (xem danh bạ)
#   can_read/can_write : được đọc / ghi dữ liệu ở các tầng trên
#   can_view_sensitive : được xem cột nhạy cảm (sensitive: true trong hợp đồng); false -> cột bị ẩn khi đọc
#   can_view_audit     : được xem sổ audit_log trên dashboard
# Người dùng không có trong danh sách users -> default_role (mặc định từ chối mọi tầng dữ liệu).

roles:
  # 1. Kỹ sư dữ liệu (Data Engineer): Có toàn quyền truy cập để vận hành pipeline dữ liệu
  data_engineer:
    display_name: "Kỹ sư dữ liệu"
    allowed_tiers:
      - raw
      - standardized
      - ai_ready
      - catalog
    can_read: true
    can_write: true
    can_view_sensitive: true
    can_view_audit: true
    description: "Toàn quyền đọc/ghi mọi tầng dữ liệu và cấu hình hệ thống"

  # 2. Chuyên viên phân tích (Analyst): Đọc được tầng chuẩn hóa nhưng KHÔNG thấy cột định danh
  analyst:
    display_name: "Chuyên viên phân tích"
    allowed_tiers:
      - standardized
      - ai_ready
      - catalog
    can_read: true
    can_write: false
    can_view_sensitive: false
    can_view_audit: false
    description: "Đọc tầng standardized và AI-ready; cột nhạy cảm (patient_id, ...) bị ẩn khi đọc"

  # 3. Nhà nghiên cứu (Researcher): Chỉ được phép đọc tầng AI-ready (đã ẩn danh & kiểm định)
  researcher:
    display_name: "Nhà nghiên cứu"
    allowed_tiers:
      - ai_ready
      - catalog
    can_read: true
    can_write: false
    can_view_sensitive: false
    can_view_audit: false
    description: "Chỉ được phép đọc tầng AI-ready đã ẩn danh; tuyệt đối cấm dữ liệu thô và nhạy cảm"

  # 4. Khách (Guest / Viewer): Chỉ được xem danh bạ bảng dữ liệu
  guest:
    display_name: "Khách xem"
    allowed_tiers:
      - catalog
    can_read: false
    can_write: false
    can_view_sensitive: false
    can_view_audit: false
    description: "Chỉ được tra cứu metadata catalog, không được đọc dữ liệu chi tiết của các tầng"

# Danh sách người dùng được gán vai trò mẫu (Users Mapping)
