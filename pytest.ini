[pytest]
testpaths = governance/tests catalog_access/tests pipeline/tests dashboard/tests
pythonpath = .
addopts = --import-mode=importlib
markers =
    spark: test chạy Apache Spark (chậm hơn; bỏ qua bằng: pytest -m "not spark")
filterwarnings =
    ignore:PySpark does not yet fully support pandas:FutureWarning
